# Vercel plugin (deployments-cicd skill): prebuilt deploy — build in CI, ship artifact only.
name: Lab 5 report (Vercel)

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: vercel-lab5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static lab report
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python scripts/build_report.py

      - name: Install Vercel CLI
        run: npm install -g vercel@54.5.1

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel output (prebuilt)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview or production
        id: deploy
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          else
            url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**Lab 5 report (Vercel preview)**\n${{ steps.deploy.outputs.url }}\n\nRender still runs the scheduled notebook execution; this URL is the readable HTML export.`
            })
